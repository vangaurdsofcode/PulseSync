services:
  app:
    build:
      context: ./laravel-app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pulsesync
      DB_USERNAME: pulsesync
      DB_PASSWORD: pulsesync
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "APP_KEY=$$(php artisan key:generate --show) && export APP_KEY && php artisan migrate --seed --force && php artisan serve --host=0.0.0.0"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsesync
      POSTGRES_USER: pulsesync
      POSTGRES_PASSWORD: pulsesync
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsesync -d pulsesync"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./laravel-app
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pulsesync
      DB_USERNAME: pulsesync
      DB_PASSWORD: pulsesync
      QUEUE_CONNECTION: database
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command: sh -c "until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done; php artisan queue:work --sleep=1 --tries=5"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15

  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - ./wordpress-plugin:/var/www/html/wp-content/plugins/pulsesync-connector
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  postgres-data:
  mysql-data:
